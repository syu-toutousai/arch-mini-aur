name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Prepare Arch container
        run: |
          if ! grep -q '^\[multilib\]' /etc/pacman.conf; then
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          fi
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed asar nodejs npm gnupg sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build all packages
        run: |
          WORKDIR="$GITHUB_WORKSPACE"
          chown -R builder:builder "$WORKDIR"
          su builder -c "cd '$WORKDIR' && bash tools/ci-build.sh"

      - name: Build staging repository
        run: |
          mkdir -p repo
          find pkgs -mindepth 2 -maxdepth 2 -name '*.pkg.tar.zst' ! -name '*-debug-*' -exec cp -t repo {} +
          for f in repo/lib32-libshout-1:*.pkg.tar.zst; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"
            new="$(printf '%s\n' "$base" | sed 's/^lib32-libshout-1:/lib32-libshout-/')"
            mv "$f" "repo/$new"
          done
          repo-add repo/syu-mini-aur.db.tar.gz repo/*.pkg.tar.zst
          cp --remove-destination repo/syu-mini-aur.db.tar.gz repo/syu-mini-aur.db
          cp --remove-destination repo/syu-mini-aur.files.tar.gz repo/syu-mini-aur.files
          sha256sum repo/*.pkg.tar.zst > repo/SHA256SUMS
          ls -lh repo

      - name: Upload staging repository
        uses: actions/upload-artifact@v4
        with:
          name: mini-aur
          path: repo/
          if-no-files-found: error
